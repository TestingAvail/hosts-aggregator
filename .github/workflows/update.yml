name: build mega hosts

on:
  schedule:
    - cron: '0 3 * * *' # запуск каждый день в 3 часа ночи по UTC
  workflow_dispatch: # ручной запуск кнопкой из интерфейса

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Включаем кэширование pip для скорости

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: run parser
        run: python update.py

      - name: Generate Checksums & Tag
        id: meta
        run: |
          sha256sum hosts.txt > hosts.txt.sha256
          sha256sum abp.txt > abp.txt.sha256
          sha256sum hosts-slim.txt > hosts-slim.txt.sha256
          sha256sum abp-slim.txt > abp-slim.txt.sha256
          TAG_NAME="hosts-$(date -u +'%Y.%m.%d-%H%M')"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Generated tag: $TAG_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.TAG_NAME }}
          name: "Mega Hosts Release ${{ steps.meta.outputs.TAG_NAME }}"
          body: "Automated aggregated fat and slim hosts/ABP blocklists with SHA256 checksums."
          files: |
            hosts.txt
            hosts.txt.sha256
            abp.txt
            abp.txt.sha256
            hosts-slim.txt
            hosts-slim.txt.sha256
            abp-slim.txt
            abp-slim.txt.sha256

      - name: Prune old releases (keep last 30)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP=30
          gh release list --limit 1000 --json tagName --jq '.[].tagName' \
            | tail -n +$((KEEP+1)) \
            | while read -r tag; do
                echo "Удаляю релиз $tag"
                gh release delete "$tag" --yes --cleanup-tag || true
              done

      - name: commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hosts.txt hosts.txt.sha256 hosts-slim.txt hosts-slim.txt.sha256 abp.txt abp.txt.sha256 abp-slim.txt abp-slim.txt.sha256
          git diff --quiet && git diff --staged --quiet || (git commit -m "update blocklists [skip ci]" && git push)
