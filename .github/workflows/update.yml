name: build mega hosts

on:
  schedule:
    - cron: '0 3 * * *' # запуск каждый день в 3 часа ночи по уцц
  workflow_dispatch: # ручной запуск кнопкой из интерфейса гитхаба

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: run parser
        run: python update.py

      - name: commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hosts.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "update mega hosts list [skip ci]" && git push)
