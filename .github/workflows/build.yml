name: Build and publish blocklists

on:
  push:
    branches: [main]
    paths:
      - "update.py"
      - "audit_dns.py"
      - "requirements.txt"
      - "tests/**"
      - "scripts/**"
      - "SOURCES.md"
      - "SOURCE-CANDIDATES.md"
      - "README.md"
      - ".github/workflows/build.yml"
  schedule:
    # HaGeZi publishes its daily reference build around 11:00 UTC.
    # Run after that publication window; GitHub may still delay scheduled jobs.
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      run_dns_audit:
        description: "Run a non-destructive DNS diagnostic sample after building"
        required: false
        type: boolean
        default: false
      allow_source_shrink:
        description: "Accept a source that shrank by over 50% (only after reviewing its upstream change)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hosts-aggregator-main
  cancel-in-progress: false

jobs:
  build:
    name: Build FAT and SLIM
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      SOURCE_CACHE_DIR: ${{ github.workspace }}/.source-cache
      SOURCE_CACHE_MAX_AGE_DAYS: "14"
      ALLOW_SOURCE_SHRINK: ${{ inputs.allow_source_shrink || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore last successful source snapshots
        uses: actions/cache@v6
        with:
          path: .source-cache
          key: source-cache-v4-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            source-cache-v4-${{ runner.os }}-

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q update.py audit_dns.py scripts tests

      - name: Run offline tests
        run: |
          python update.py --self-test
          python -m unittest discover -s tests -v

      - name: Build all profiles
        run: python update.py

      - name: Optional non-destructive DNS audit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_dns_audit }}
        run: |
          python audit_dns.py \
            --files hosts.txt hosts-slim.txt \
            --limit 10000 \
            --concurrency 100 \
            --output dns-audit.csv

      - name: Verify generated files and checksums
        run: |
          test -s hosts.txt
          test -s abp.txt
          test -s hosts-slim.txt
          test -s abp-slim.txt
          test -s build-report.json
          test -s SHA256SUMS
          test -s source-map.tsv.gz
          sha256sum -c SHA256SUMS

      - name: Commit generated router lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hosts.txt abp.txt hosts-slim.txt abp-slim.txt build-report.json SHA256SUMS
          if git diff --cached --quiet; then
            echo "Generated files have no changes."
          else
            git commit -m "chore: update generated blocklists [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: hosts-aggregator-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            hosts.txt
            abp.txt
            hosts-slim.txt
            abp-slim.txt
            build-report.json
            SHA256SUMS
            source-map.tsv.gz
            dns-audit.csv
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: hosts-aggregator-${{ github.run_number }}-${{ github.run_attempt }}
          name: Hosts Aggregator build #${{ github.run_number }}
          target_commitish: main
          make_latest: true
          draft: false
          prerelease: false
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            hosts.txt
            abp.txt
            hosts-slim.txt
            abp-slim.txt
            build-report.json
            SHA256SUMS
            source-map.tsv.gz

      - name: Keep newest 30 releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_RELEASES: "30"
        run: python scripts/prune_releases.py
