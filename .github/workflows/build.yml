name: Build and publish blocklists

on:
  push:
    branches: [main]
    paths:
      - "update.py"
      - "audit_dns.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/**"
      - "README.md"
      - "SOURCES.md"
      - ".gitignore"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      run_dns_audit:
        description: "Run the slower, non-destructive DNS audit after building"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hosts-aggregator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore last successful source snapshots
        uses: actions/cache@v6
        with:
          path: .source-cache
          key: hosts-source-cache-v3-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hosts-source-cache-v3-${{ runner.os }}-

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run tests
        run: |
          python -m py_compile update.py audit_dns.py scripts/prune_releases.py
          python -m unittest discover -s tests -v
          git diff --check

      - name: Build FAT and SLIM lists
        run: python update.py

      - name: Optional DNS audit (non-destructive)
        if: ${{ inputs.run_dns_audit == true }}
        run: python audit_dns.py --input hosts.txt hosts-slim.txt

      - name: Upload build files
        uses: actions/upload-artifact@v7
        with:
          name: hosts-aggregator-${{ github.run_number }}
          path: |
            hosts.txt
            abp.txt
            hosts-slim.txt
            abp-slim.txt
            build-report.json
            SHA256SUMS
            dns-audit.csv
            dns-audit-summary.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hosts.txt abp.txt hosts-slim.txt abp-slim.txt build-report.json SHA256SUMS
          if git diff --cached --quiet; then
            echo "Generated lists are unchanged."
          else
            git commit -m "chore: update generated blocklists"
            git push origin HEAD:main
          fi

      - name: Publish rolling GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: hosts-${{ github.run_number }}-${{ github.run_attempt }}
          name: "Blocklists build #${{ github.run_number }}"
          body: |
            Automated FAT and SLIM router blocklists.

            See `build-report.json` for source status, unique-domain contributions,
            overlap statistics, file sizes and SHA-256 hashes.
          files: |
            hosts.txt
            abp.txt
            hosts-slim.txt
            abp-slim.txt
            build-report.json
            SHA256SUMS
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the 30 newest releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/prune_releases.py --keep 30
