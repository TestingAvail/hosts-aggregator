name: Test builder

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "update.py"
      - "audit_dns.py"
      - "requirements.txt"
      - "tests/**"
      - "SOURCES.md"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: |
          python -m py_compile update.py audit_dns.py scripts/prune_releases.py
          python -m unittest discover -s tests -v
          git diff --check
